services:
  attendance:
    build: .
    ports:
      - "3000:3000"
    environment:
      # 선생님 로그인 PIN — 반드시 바꿔서 사용하세요
      - TEACHER_PIN=${TEACHER_PIN:-0000}
      # 요일/시각 판정 기준 시간대 (기본 한국)
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      # 출석 데이터는 호스트의 ./data 폴더에 저장됩니다 (컨테이너를 지워도 유지)
      - ./data:/app/data
    restart: unless-stopped
