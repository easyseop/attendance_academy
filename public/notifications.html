<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학부모 알림 내역</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <header class="topbar">
    <h1>📨 학부모 알림 내역</h1>
    <a href="/">← 반 목록</a>
  </header>

  <div class="card">
    <p class="muted" style="margin-bottom:12px;">
      출석/지각/결석 시 자동 생성되는 알림 대기열입니다.
      실제 문자·알림톡 발송은 외부 API(카카오 비즈메시지, NHN Cloud 등) 연동 후 동작합니다.
    </p>
    <table>
      <thead><tr><th>시각</th><th>학생</th><th>연락처</th><th>내용</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
(async () => {
  const rows = await api('/api/admin/notifications');
  document.getElementById('rows').innerHTML = rows.map(n => `
    <tr>
      <td class="muted">${esc(n.created_at)}</td>
      <td><strong>${esc(n.student_name)}</strong></td>
      <td class="muted">${esc(n.phone)}</td>
      <td>${esc(n.message)}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="muted">아직 알림이 없습니다.</td></tr>';
})().catch(() => {});
</script>
</body>
</html>
